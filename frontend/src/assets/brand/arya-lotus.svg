<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" fill="none">
  <title>Arya Tarray Lotus</title>
  <defs>
    <linearGradient id="lotus-navy" x1="24" y1="18" x2="92" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173B68"/>
      <stop offset="1" stop-color="#0F2D5B"/>
    </linearGradient>
    <linearGradient id="lotus-teal" x1="33" y1="28" x2="82" y2="79" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A9AA8"/>
      <stop offset="1" stop-color="#2F7385"/>
    </linearGradient>
    <linearGradient id="lotus-gold" x1="48" y1="10" x2="73" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4BB55"/>
      <stop offset="1" stop-color="#C9972D"/>
    </linearGradient>
  </defs>

  <!-- central crown / upper lotus petal -->
  <path d="M60 8C51 18 44 27 44 39c0 8 4 15 10 20 1-11 3-20 6-27 3 7 5 16 6 27 6-5 10-12 10-20C76 27 69 18 60 8Z" fill="url(#lotus-navy)"/>
  <path d="M60 10C53 19 49 27 49 36c0 6 2 11 6 15 1-7 3-14 5-19 2 5 4 12 5 19 4-4 6-9 6-15 0-9-4-17-11-26Z" stroke="url(#lotus-gold)" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- inner side petals -->
  <path d="M57 70C45 66 36 58 32 47c-2-7-2-14-1-22 10 5 18 11 23 19 5 8 6 17 3 26Z" fill="url(#lotus-teal)" stroke="#D5AD4B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M63 70c12-4 21-12 25-23 2-7 2-14 1-22-10 5-18 11-23 19-5 8-6 17-3 26Z" fill="url(#lotus-teal)" stroke="#D5AD4B" stroke-width="2" stroke-linejoin="round"/>

  <!-- outer petals -->
  <path d="M57 76C42 76 29 71 20 61 13 54 9 47 7 39c12 0 23 2 32 7 11 6 17 16 18 30Z" fill="url(#lotus-navy)"/>
  <path d="M63 76c15 0 28-5 37-15 7-7 11-14 13-22-12 0-23 2-32 7-11 6-17 16-18 30Z" fill="url(#lotus-navy)"/>

  <!-- central golden flame -->
  <path d="M60 34c-6 8-10 15-10 24 0 7 4 13 10 18 6-5 10-11 10-18 0-9-4-16-10-24Z" fill="url(#lotus-gold)"/>
  <path d="M60 43c-3 5-5 10-5 15 0 4 2 8 5 11 3-3 5-7 5-11 0-5-2-10-5-15Z" fill="#FFF8E6" opacity=".92"/>

  <!-- dot and grounding ornament -->
  <circle cx="60" cy="27" r="3.3" fill="#E3B64A"/>
  <path d="M18 78c12 5 25 7 39 5M102 78c-12 5-25 7-39 5" stroke="#D2A13C" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M60 80l4 4-4 6-4-6 4-4Z" fill="#D2A13C"/>
</svg>
